name: Automated Builds

env:
  # mise's own version, the one version that cannot be in mise.toml
  MISE_VERSION: '2026.11.8'
  # Every tool mise installs must be in mise.lock, with its checksum
  MISE_LOCKED: '1'
  QT_VERSION: '6.7.3'

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

# A second run for the same tag waits for the first instead of cancelling it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            host: linux
            arch: linux_gcc_64
            folder: gcc_64
          - os: ubuntu-22.04-arm
            host: linux_arm64
            arch: linux_gcc_arm64
            folder: gcc_arm64

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Download source codes
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # mise-action runs `mise install --locked`, which installs the tools of
    # mise.toml, each checked against its checksum in mise.lock, and
    # aqtinstall from its version tag. Its own cache stays off, since nothing
    # checks an installed tool again.
    - name: Install the tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: ${{ env.MISE_VERSION }}
        cache: false
        env: false

    # patchelf goes into linuxdeployqt's AppImage, so it stays the one
    # Ubuntu 22.04 shipped, at that version; apt checks Ubuntu's signature.
    # The compiler and the system's libraries are the runner image's.
    - name: Install patchelf
      run: |
        sudo apt-get update -y
        sudo apt-get install -y patchelf=0.14.3-1

    # aqtinstall checks every archive against the checksum on download.qt.io
    - name: Install Qt
      env:
        HOST: ${{ matrix.host }}
        ARCH: ${{ matrix.arch }}
      run: mise exec -- aqt install-qt "$HOST" desktop "$QT_VERSION" "$ARCH" -O /tmp/qt

    # CMake is mise's, not the one Qt's qt-cmake script would pick
    - name: Build
      env:
        FOLDER: ${{ matrix.folder }}
      run: |
        mise exec -- cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D "CMAKE_PREFIX_PATH=/tmp/qt/$QT_VERSION/$FOLDER"
        mise exec -- cmake --build build --parallel
        mkdir executables
        cp build/deploy/*.AppImage executables

    - name: Check version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # The binary reports the project version from CMakeLists.txt, which must match the tag
        if ! build/linuxdeployqt -version 2>&1 | grep -Fx "linuxdeployqt $GITHUB_REF_NAME"; then
          echo "::error::linuxdeployqt does not report $GITHUB_REF_NAME, update the version in CMakeLists.txt"
          exit 1
        fi

    # An artifact belongs to this run alone, so the release job publishes
    # exactly what this run built
    - name: Keep executables for publication
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: executables-${{ matrix.os }}
        path: executables
        if-no-files-found: error
        retention-days: 1

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    # The full history and the tags are needed to find the previous version
    - name: Download source codes
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    # Installs mise alone; the two steps below name gh and jq, which mise then
    # installs as mise.lock records them
    - name: Install mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: ${{ env.MISE_VERSION }}
        install: false
        cache: false
        env: false

    - name: Fetch the executables
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: executables-*
        merge-multiple: true
        path: executables

    # Every commit since the previous version, credited to its author's GitHub
    # account, so that GitHub shows each author's avatar under the release
    - name: Write release notes
      shell: mise exec gh jq -- bash --noprofile --norc -eo pipefail {0}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES="$RUNNER_TEMP/notes.md"
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "First versioned release." > "$NOTES"
          exit 0
        fi
        COMPARE="$RUNNER_TEMP/compare.json"
        gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$GITHUB_REF_NAME" > "$COMPARE"
        KNOWN_EMAILS=$(git log --format=%ae "$PREVIOUS_TAG" | sort -u)
        NEW_CONTRIBUTORS=$(jq -r '.commits[] | select((.parents | length) == 1 and .author.login != null)
            | [.author.login, .commit.author.email, .sha[0:7], .html_url] | @tsv' "$COMPARE" \
          | while IFS=$'\t' read -r LOGIN EMAIL SHA URL; do
              grep -Fxq "$EMAIL" <<< "$KNOWN_EMAILS" || echo "* @$LOGIN made their first contribution in [\`$SHA\`]($URL)"
            done | awk '!seen[$2]++')
        {
          echo "## What's Changed"
          echo
          jq -r '.commits[] | select((.parents | length) == 1)
            | "* \(.commit.message | split("\n")[0]) by \(if .author.login then "@" + .author.login else .commit.author.name end) in [`\(.sha[0:7])`](\(.html_url))"' "$COMPARE"
          if [ -n "$NEW_CONTRIBUTORS" ]; then
            echo
            echo "## New Contributors"
            echo
            echo "$NEW_CONTRIBUTORS"
          fi
          echo
          echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$GITHUB_REF_NAME"
        } > "$NOTES"

    - name: Publish versioned release
      working-directory: executables
      shell: mise exec gh -- bash --noprofile --norc -eo pipefail {0}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # A versioned release is never modified: fail if one exists for this tag
        if gh release view "$GITHUB_REF_NAME" > /dev/null; then
          echo "::error::Release $GITHUB_REF_NAME already exists"
          exit 1
        fi
        sha256sum linuxdeployqt-x86_64.AppImage linuxdeployqt-arm64.AppImage > SHA256SUMS
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
          linuxdeployqt-x86_64.AppImage linuxdeployqt-arm64.AppImage SHA256SUMS
