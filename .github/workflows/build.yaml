name: Automated Builds

env:
  QT_VERSION: '6.7.3'

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Download source codes
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential ninja-build patchelf libglib2.0-dev
        pip install aqtinstall
        mkdir executables

    - name: Install Qt
      if: matrix.os == 'ubuntu-22.04'
      run: |
        python3 -m aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -O /tmp/qt

    - name: Install Qt
      if: matrix.os == 'ubuntu-22.04-arm'
      run: |
        python3 -m aqt install-qt linux_arm64 desktop $QT_VERSION linux_gcc_arm64 -O /tmp/qt

    - name: Build for amd64
      if: matrix.os == 'ubuntu-22.04'
      run: |
        chmod +x /tmp/qt/$QT_VERSION/gcc_64/bin/qt-cmake
        /tmp/qt/$QT_VERSION/gcc_64/bin/qt-cmake \
          -S . \
          -B build-amd64 \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release
        cmake --build build-amd64 --parallel --config Release
        cp build-amd64/deploy/*.AppImage executables

    - name: Build for Linux arm64
      if: matrix.os == 'ubuntu-22.04-arm'
      run: |
        chmod +x /tmp/qt/$QT_VERSION/gcc_arm64/bin/qt-cmake
        /tmp/qt/$QT_VERSION/gcc_arm64/bin/qt-cmake \
          -S . \
          -B build-arm64 \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release
        cmake --build build-arm64 --parallel --config Release
        cp build-arm64/deploy/*.AppImage executables

    - name: Check version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # The binary reports the project version from CMakeLists.txt, which must match the tag
        if ! build-*/linuxdeployqt -version 2>&1 | grep -Fx "linuxdeployqt $GITHUB_REF_NAME"; then
          echo "::error::linuxdeployqt does not report $GITHUB_REF_NAME, update the version in CMakeLists.txt"
          exit 1
        fi

    - name: Cache executables for publication
      uses: actions/cache/save@v4
      with:
        enableCrossOsArchive: true
        key: ${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: executables

  publish:
    name: Publish
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
    - name: Restore Linux amd64 executables
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: ubuntu-22.04-${{ github.run_id }}-${{ github.run_attempt }}
        path: executables

    - name: Restore Linux arm64 executables
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: ubuntu-22.04-arm-${{ github.run_id }}-${{ github.run_attempt }}
        path: executables

    - name: Publish executables
      uses: marvinpinto/action-automatic-releases@v1.2.1
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        title: latest
        prerelease: false
        files: |
          executables/*.AppImage

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write

    steps:
    - name: Restore Linux amd64 executables
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: ubuntu-22.04-${{ github.run_id }}-${{ github.run_attempt }}
        path: executables

    - name: Restore Linux arm64 executables
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: ubuntu-22.04-arm-${{ github.run_id }}-${{ github.run_attempt }}
        path: executables

    - name: Publish versioned release
      working-directory: executables
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # A versioned release is never modified: fail if one exists for this tag
        if gh release view "$GITHUB_REF_NAME" > /dev/null; then
          echo "::error::Release $GITHUB_REF_NAME already exists"
          exit 1
        fi
        sha256sum linuxdeployqt-x86_64.AppImage linuxdeployqt-arm64.AppImage > SHA256SUMS
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" \
          linuxdeployqt-x86_64.AppImage linuxdeployqt-arm64.AppImage SHA256SUMS
